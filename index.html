<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}</style></head><body>
<title>מחשבון קבינה מהיר</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700&family=Heebo:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: app shell — sticky glass top bar; floating control panel at the side; result as one large card
   (key-figure tiles, 3D stage + engineering plan, specs, notes); alternatives as a card grid */
:root{
  --bg:#eef1f5; --bg-glow:#dfe7f3; --surface:#ffffff; --surface-2:#f3f5f9; --surface-3:#e8ecf2;
  --ink:#0d1420; --ink-2:#2b3646; --muted:#677385; --line:#e2e7ee; --line-2:#d3dae4;
  --accent:#3554d1; --accent-soft:#e9edfc;
  --cut:#d9480f; --cut-soft:#fff0e6; --ok:#13865c; --ok-soft:#e3f6ee; --warn:#b26b00; --warn-soft:#fff5dc;
  --wall:#c9d1db; --hatch:#a3afbd; --car:#eef3ff; --cwt:#4a5566;
  --stage-a:#f8fafc; --stage-b:#dde4ee;
  --shadow:0 1px 2px rgba(13,20,32,.04),0 8px 24px -8px rgba(13,20,32,.10);
  --shadow-lg:0 2px 4px rgba(13,20,32,.04),0 24px 48px -16px rgba(13,20,32,.18);
  --m-grlp:#0e9384; --m-grl2:#3554d1; --m-grl4:#1d2f7a; --m-grl:#7a3fe0; --m-grl2r:#c0279c;
  --f-display:"Rubik","Heebo","Segoe UI",Arial,sans-serif;
  --f-body:"Heebo","Segoe UI",Arial,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#090c12; --bg-glow:#131b2c; --surface:#11161f; --surface-2:#171d28; --surface-3:#1f2733;
  --ink:#e8eef6; --ink-2:#c3cddb; --muted:#8793a5; --line:#1f2733; --line-2:#2a3341;
  --accent:#7d93ff; --accent-soft:#1b2347;
  --cut:#ff8a4c; --cut-soft:#3a1e10; --ok:#4fd19b; --ok-soft:#10291f; --warn:#f5b942; --warn-soft:#33270b;
  --wall:#2b3542; --hatch:#46525f; --car:#18213a; --cwt:#a6b2c2;
  --stage-a:#161d29; --stage-b:#0b0f16;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -8px rgba(0,0,0,.5);
  --shadow-lg:0 2px 4px rgba(0,0,0,.4),0 24px 48px -16px rgba(0,0,0,.6);
  --m-grlp:#2ec4b0; --m-grl2:#7d93ff; --m-grl4:#a9b8ff; --m-grl:#b28cff; --m-grl2r:#f07ccf; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#090c12; --bg-glow:#131b2c; --surface:#11161f; --surface-2:#171d28; --surface-3:#1f2733;
  --ink:#e8eef6; --ink-2:#c3cddb; --muted:#8793a5; --line:#1f2733; --line-2:#2a3341;
  --accent:#7d93ff; --accent-soft:#1b2347;
  --cut:#ff8a4c; --cut-soft:#3a1e10; --ok:#4fd19b; --ok-soft:#10291f; --warn:#f5b942; --warn-soft:#33270b;
  --wall:#2b3542; --hatch:#46525f; --car:#18213a; --cwt:#a6b2c2;
  --stage-a:#161d29; --stage-b:#0b0f16;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -8px rgba(0,0,0,.5);
  --shadow-lg:0 2px 4px rgba(0,0,0,.4),0 24px 48px -16px rgba(0,0,0,.6);
  --m-grlp:#2ec4b0; --m-grl2:#7d93ff; --m-grl4:#a9b8ff; --m-grl:#b28cff; --m-grl2r:#f07ccf; color-scheme:dark}
*{box-sizing:border-box}
body{background:radial-gradient(1200px 520px at 85% -10%,var(--bg-glow),transparent 70%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:0 48px;-webkit-font-smoothing:antialiased}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.num,dd:not(.txt),td.num{direction:ltr;unicode-bidi:isolate}
dd:not(.txt){text-align:left}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:-16px;padding:12px 16px;backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);background:color-mix(in srgb,var(--bg) 72%,transparent);border-bottom:1px solid var(--line)}
.topbar .in{max-width:1440px;margin-inline:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(140deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#000));display:grid;place-items:center;box-shadow:0 6px 16px -6px var(--accent)}
.logo svg{width:20px;height:20px}
.brand h1{font-family:var(--f-display);font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em;line-height:1.1}
.brand p{margin:0;font-size:12.5px;color:var(--muted)}
.chip-db{margin-inline-start:auto;font-size:12.5px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:5px 12px;display:inline-flex;gap:6px;align-items:center;box-shadow:var(--shadow)}
.chip-db i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.wrap{max-width:1440px;margin-inline:auto;display:grid;gap:20px;padding-top:20px}
.main{display:grid;grid-template-columns:330px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:960px){.main{grid-template-columns:1fr}}
form{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;display:grid;gap:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);max-height:calc(100vh - 96px);overflow:auto;box-shadow:var(--shadow);scrollbar-width:thin}
@media (max-width:960px){form{position:static;max-height:none}}
fieldset{border:0;padding:0;margin:0;display:grid;gap:10px}
.sec-t{font-family:var(--f-display);font-size:13px;font-weight:600;color:var(--ink);margin:0;display:flex;align-items:center;gap:8px}
.sec-t::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--accent)}
.sec-t .hint{font-family:var(--f-body);font-weight:400}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:grid;gap:5px;font-size:12.5px;color:var(--muted);font-weight:500;min-width:0}
input,select{font:inherit;font-family:var(--f-num);font-size:15px;font-weight:500;padding:9px 12px;border:1px solid transparent;border-radius:var(--r-sm);background:var(--surface-2);color:var(--ink);width:100%;min-width:0;transition:border-color .15s,background .15s,box-shadow .15s}
input:hover,select:hover{border-color:var(--line-2)}
input:focus,select:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 4px var(--accent-soft)}
input::placeholder{color:var(--muted);font-family:var(--f-body);font-size:13px;font-weight:400}
select{font-family:var(--f-body);appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:left 16px center,left 11px center;background-size:5px 5px;background-repeat:no-repeat;padding-inline-start:28px}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:flex;padding:3px;gap:2px;background:var(--surface-2);border-radius:12px}
.seg label{flex:1;display:flex;justify-content:center;align-items:center;border-radius:9px;padding:7px 8px;cursor:pointer;font-size:13px;color:var(--ink-2);font-weight:500;text-align:center;transition:background .15s,color .15s,box-shadow .15s}
.seg label:hover{color:var(--ink)}
.seg label:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.seg input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.seg label:has(input:checked){background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(13,20,32,.08),0 2px 8px -2px rgba(13,20,32,.14);font-weight:600}
.check{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink-2)}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.hint{font-size:12px;color:var(--muted);margin:0}
.more{display:grid;border-top:1px solid var(--line);padding-top:14px;gap:4px}
.opt{border-radius:var(--r-sm);transition:background .15s}
.opt[open]{background:var(--surface-2)}
.opt>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:9px 10px;font-size:13.5px;font-weight:500;border-radius:var(--r-sm)}
.opt>summary:hover{background:var(--surface-2)}
.opt>summary::-webkit-details-marker{display:none}
.opt>summary::after{content:"";width:7px;height:7px;border-inline-end:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s;margin-inline-start:4px;margin-top:-3px}
.opt[open]>summary::after{transform:rotate(225deg);margin-top:3px}
.opt>summary .val{color:var(--muted);margin-inline-start:auto;font-size:12px;font-weight:400}
.opt>summary .val.set{color:var(--accent);font-weight:600;background:var(--accent-soft);padding:1px 8px;border-radius:99px}
.opt>div{display:grid;gap:10px;padding:2px 10px 12px}
.opt[open] input,.opt[open] select,.opt[open] .seg{background:var(--surface)}
.opt[open] .seg label:has(input:checked){background:var(--surface-3)}
.results{display:grid;gap:18px;min-width:0}
.tabs{display:flex;gap:2px;padding:3px;background:var(--surface-2);border-radius:12px;margin-inline-start:18px}
.tabs button{border:0;background:transparent;padding:7px 16px;border-radius:9px;font-weight:500;color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(13,20,32,.12)}
@media (max-width:640px){.tabs{order:3;margin-inline-start:0;width:100%}.tabs button{flex:1}}
.screen{display:block}
.mtbl{padding:0 22px}
.mtbl input{padding:7px 8px;font-size:14px;min-width:64px}
.mtbl td{padding:4px 4px}
.mtbl td.calc{color:var(--muted);text-align:center}
td.cutc{color:var(--cut);font-weight:700}
td.muted{color:var(--muted)}
table.ord th{color:var(--muted);font-weight:500;font-size:11.5px;white-space:normal}
table.ord td{white-space:normal;font-family:var(--f-num);font-size:12.5px}
.ofiles{display:flex;gap:8px;flex-wrap:wrap}
.filebtn{display:inline-flex;align-items:center;font-size:13px;font-weight:500;padding:8px 14px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);color:var(--ink);cursor:pointer}
.export{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:0 22px 18px}
.export input{max-width:260px;font-family:var(--f-body)}
.export .go{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.export .go:hover:not(:disabled){background:var(--accent);filter:brightness(1.08)}
.pdfst{font-size:12.5px;color:var(--muted)} .pdfst.ok{color:var(--ok)} .pdfst.warn{color:var(--warn)}
.lifts2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.vplan svg{max-height:760px}
.summary{display:flex;flex-wrap:wrap;gap:8px}
.summary span{font-size:12.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 12px}
.summary b{color:var(--ink);font-weight:600}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);display:grid;min-width:0;box-shadow:var(--shadow-lg);overflow:hidden;position:relative}
.hero::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--mc),color-mix(in srgb,var(--mc) 30%,transparent))}
.bar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 14px;padding:24px 22px 6px}
.bar .t{display:grid;gap:8px;min-width:0}
.rank{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--mc);display:flex;align-items:center;gap:6px}
.rank::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--mc);box-shadow:0 0 0 3px color-mix(in srgb,var(--mc) 20%,transparent)}
.bar h2{margin:0;font-family:var(--f-display);font-size:36px;font-weight:700;letter-spacing:-.02em;line-height:1}
.bar h2 small{font-size:14px;color:var(--muted);font-weight:500;font-family:var(--f-body);margin-inline-start:8px;letter-spacing:0}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.nav{margin-inline-start:auto;display:flex;gap:6px;align-items:center}
.nav .cnt{font-size:12.5px;color:var(--muted);padding-inline:6px}
button{font:inherit;font-size:13px;font-weight:500;padding:8px 14px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);color:var(--ink);cursor:pointer;transition:background .15s,border-color .15s,transform .1s,box-shadow .15s}
button:hover:not(:disabled){background:var(--surface-2)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.35;cursor:default}
.icon-btn{width:38px;height:38px;padding:0;display:grid;place-items:center;border-radius:12px}
.icon-btn svg{width:16px;height:16px}
.pill{font-size:12px;font-weight:500;padding:3px 10px;border-radius:99px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.pm{color:#fff;background:var(--mc)}
.p-std{color:var(--ok);background:var(--ok-soft)}
.p-warn{color:var(--warn);background:var(--warn-soft)}
.p-cut{color:var(--cut);background:var(--cut-soft)}
.p-mut{color:var(--ink-2);background:var(--surface-3)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:16px 22px 20px}
@media (max-width:720px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface-2);border-radius:var(--r-md);padding:12px 14px;display:grid;gap:2px;min-width:0}
.kpi>span{font-size:12px;color:var(--muted);font-weight:500}
.kpi b{font-family:var(--f-num);font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi b small{font-size:12px;color:var(--muted);font-weight:500;font-family:var(--f-body);margin-inline-start:5px;letter-spacing:0}
.views{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:12px;padding:0 22px 22px}
@media (max-width:1150px){.views{grid-template-columns:1fr}}
.v3d{position:relative;border-radius:var(--r-md);background:radial-gradient(120% 90% at 50% 15%,var(--stage-a),var(--stage-b));min-height:500px;touch-action:none;cursor:grab;overflow:hidden;border:1px solid var(--line)}
.v3d canvas{display:block;width:100%!important;height:100%!important;position:absolute;inset:0}
.v3d .lbl{position:absolute;inset-inline-start:12px;bottom:10px;font-size:11.5px;color:var(--muted);pointer-events:none;background:color-mix(in srgb,var(--surface) 70%,transparent);backdrop-filter:blur(6px);padding:4px 10px;border-radius:99px}
.v3d .cams{position:absolute;inset-inline-end:12px;top:12px;display:flex;padding:3px;gap:2px;border-radius:12px;background:color-mix(in srgb,var(--surface) 75%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line)}
.v3d .cams button{font-size:12px;padding:5px 12px;border:0;background:transparent;border-radius:9px}
.v3d .cams button.on{background:var(--surface);box-shadow:0 1px 3px rgba(13,20,32,.15);font-weight:600}
.vtag{position:absolute;inset-inline-start:12px;top:12px;font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.04em;pointer-events:none}
.vplan{position:relative;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);padding:32px 8px 8px;min-width:0;display:grid;align-content:center}
.vplan svg{width:100%;height:auto;display:block;max-height:640px}
.body{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;padding:20px 22px 24px;border-top:1px solid var(--line)}
@media (max-width:1150px){.body{grid-template-columns:1fr}}
.specs-t{font-family:var(--f-display);font-size:14px;font-weight:600;margin:0 0 6px}
dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px;margin:0}
@media (max-width:560px){dl{grid-template-columns:1fr}}
dl div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);min-width:0}
dt{font-size:13px;color:var(--muted)}
dd{margin:0;font-family:var(--f-num);font-size:14px;font-weight:500;text-align:end}
dd.txt{font-family:var(--f-body)}
.side{display:grid;gap:12px;align-content:start;min-width:0}
.notes{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.notes li{font-size:13.5px;padding:9px 12px;border-radius:var(--r-sm);background:var(--surface-2);color:var(--ink-2);border-inline-start:3px solid var(--line-2)}
.notes li.cut{background:var(--cut-soft);color:var(--cut);border-color:var(--cut)}
.notes li.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.refs{font-size:12.5px;color:var(--muted);line-height:1.7}
.refs b{color:var(--ink);font-weight:500}
.cfg{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:var(--r-md);background:linear-gradient(120deg,var(--accent-soft),transparent);border:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:500;font-size:13.5px;transition:border-color .15s}
.cfg:hover{border-color:var(--accent)}
.cfg span{color:var(--accent)}
.alts{display:grid;gap:12px}
.alts-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;cursor:pointer;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 18px;box-shadow:var(--shadow)}
.alts-h::-webkit-details-marker{display:none}
.alts-h h3::before{content:'＋ ';color:var(--accent)}
.alts[open] .alts-h h3::before{content:'－ '}
.alts[open]{display:grid;gap:12px}
.alts-h h3{margin:0;font-family:var(--f-display);font-size:16px;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--mc);display:inline-block}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.alt{position:relative;display:grid;gap:8px;align-content:start;text-align:start;width:100%;padding:16px 16px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow);overflow:hidden}
.alt::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--mc)}
.alt:hover:not(:disabled){transform:translateY(-2px);box-shadow:var(--shadow-lg);background:var(--surface)}
.alt.on{border-color:var(--mc);box-shadow:0 0 0 1px var(--mc),var(--shadow-lg)}
.alt .top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.alt .sz{font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:-.01em}
.alt .i{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.alt .meta{font-size:12.5px;color:var(--muted)}
.alt .pills .pill{font-size:11px;padding:2px 8px}
.empty{background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r-lg);padding:28px;color:var(--muted);line-height:1.8}
.empty b{color:var(--ink);font-family:var(--f-display);font-size:16px;display:block;margin-bottom:4px}
details.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 20px;box-shadow:var(--shadow)}
details.box>summary{cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:14.5px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;font-size:12.5px;width:100%}
th{font-weight:600;color:var(--muted);font-size:11.5px;letter-spacing:.03em}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
tr:hover td{background:var(--surface-2)}
td.num{font-family:var(--f-num)}
a{color:var(--accent)}
[hidden]{display:none!important}
.hero{animation:rise .35s ease both}
@keyframes rise{from{opacity:.6;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ===== theme v10 — "living" layer: teal + coral, soft glass cards, coloured tiles, gradient header =====
   Layout concept: colourful header band with the screen switcher; airy cards floating on a soft two-tone backdrop. */
:root{
  --bg:#eef5f4; --bg-glow:#cfeee6; --bg-glow2:#ffe3d1; --surface:#ffffff; --surface-2:#f1f7f6; --surface-3:#e1efec;
  --ink:#0b1d26; --ink-2:#264049; --muted:#5d727a; --line:#dde9e7; --line-2:#c6dbd7;
  --accent:#0e7c6b; --accent-2:#14a38b; --accent-soft:#d8f2eb; --coral:#ff7a45; --coral-soft:#ffe9dd; --indigo:#4f5bd5; --indigo-soft:#e6e8fb; --amber:#e8a015; --amber-soft:#fdf1d6;
  --m-grlp:#0e7c6b; --m-grl2:#4f5bd5; --m-grl4:#25307a; --m-grl:#a24bd6; --m-grl2r:#d1438f;
  --head-a:#0c6e60; --head-b:#0f8f7b; --head-c:#14a38b;
  --shadow:0 1px 2px rgba(11,29,38,.05),0 10px 30px -12px rgba(11,29,38,.16);
  --shadow-lg:0 2px 6px rgba(11,29,38,.05),0 28px 60px -24px rgba(11,29,38,.28);
  --r-lg:24px; --r-md:16px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#071315; --bg-glow:#0c3a33; --bg-glow2:#3a1f12; --surface:#0f1f22; --surface-2:#13282b; --surface-3:#1a3337;
  --ink:#e7f3f1; --ink-2:#bcd3cf; --muted:#86a2a0; --line:#1b3236; --line-2:#26454a;
  --accent:#2dd4b0; --accent-2:#5eead4; --accent-soft:#0f3a33; --coral:#ff9466; --coral-soft:#3b2116; --indigo:#8d97ff; --indigo-soft:#1d2250; --amber:#f5bd4a; --amber-soft:#33270b;
  --m-grlp:#2dd4b0; --m-grl2:#8d97ff; --m-grl4:#b4bcff; --m-grl:#c792f0; --m-grl2r:#f282bf;
  --head-a:#0a3d37; --head-b:#0d544b; --head-c:#11695d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#071315; --bg-glow:#0c3a33; --bg-glow2:#3a1f12; --surface:#0f1f22; --surface-2:#13282b; --surface-3:#1a3337;
  --ink:#e7f3f1; --ink-2:#bcd3cf; --muted:#86a2a0; --line:#1b3236; --line-2:#26454a;
  --accent:#2dd4b0; --accent-2:#5eead4; --accent-soft:#0f3a33; --coral:#ff9466; --coral-soft:#3b2116; --indigo:#8d97ff; --indigo-soft:#1d2250; --amber:#f5bd4a; --amber-soft:#33270b;

body{background:
  radial-gradient(900px 520px at 100% 0%,var(--bg-glow),transparent 65%),
  radial-gradient(800px 480px at 0% 30%,var(--bg-glow2),transparent 60%),
  var(--bg);background-attachment:fixed}

/* header band */
.topbar{background:linear-gradient(120deg,var(--head-a),var(--head-b) 55%,var(--head-c));border-bottom:0;color:#fff;
  box-shadow:0 10px 30px -18px rgba(12,110,96,.8);backdrop-filter:none;-webkit-backdrop-filter:none;position:sticky;overflow:hidden}
.topbar::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.12;
  background:repeating-linear-gradient(90deg,#fff 0 2px,transparent 2px 120px)}
.topbar .in{position:relative;z-index:1}
.logo{background:#fff;box-shadow:0 6px 18px -6px rgba(0,0,0,.35)}
.logo svg{stroke:var(--head-a)}
.brand h1{color:#fff;font-size:20px}
.brand p{color:rgba(255,255,255,.78)}
.tabs{background:rgba(255,255,255,.14);border-radius:14px;padding:4px}

.chip-db{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);color:#fff;box-shadow:none}
.chip-db i{background:#7cf5d6;box-shadow:0 0 0 3px rgba(124,245,214,.25)}

/* cards */
form,.hero,details.box,.alts-h,.alt,.empty{border:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
form{border-radius:var(--r-lg);box-shadow:var(--shadow);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px)}
.hero{border-radius:var(--r-lg);animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.hero::before{height:5px;background:linear-gradient(90deg,var(--mc,var(--accent)),var(--coral))}
.bar{background:linear-gradient(180deg,color-mix(in srgb,var(--mc,var(--accent)) 7%,transparent),transparent)}
.bar h2{font-size:38px}
.rank{padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--mc,var(--accent)) 12%,transparent)}
.sec-t::before{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--coral))}

/* coloured key-figure tiles */
.kpi{position:relative;overflow:hidden;border-radius:var(--r-md);padding:14px 16px;transition:transform .2s}
.kpi:hover{transform:translateY(-2px)}
.kpi::after{content:"";position:absolute;inset-inline-end:-18px;top:-18px;width:64px;height:64px;border-radius:50%;opacity:.5}
.kpi:nth-child(1){background:var(--accent-soft)} .kpi:nth-child(1)::after{background:var(--accent)} .kpi:nth-child(1) b{color:var(--accent)}
.kpi:nth-child(2){background:var(--coral-soft)} .kpi:nth-child(2)::after{background:var(--coral)} .kpi:nth-child(2) b{color:var(--coral)}
.kpi:nth-child(3){background:var(--indigo-soft)} .kpi:nth-child(3)::after{background:var(--indigo)} .kpi:nth-child(3) b{color:var(--indigo)}
.kpi:nth-child(4){background:var(--amber-soft)} .kpi:nth-child(4)::after{background:var(--amber)} .kpi:nth-child(4) b{color:color-mix(in srgb,var(--amber) 80%,var(--ink))}
.kpi::after{opacity:.16}
.kpi>span{color:var(--ink-2)}
.kpi b{font-size:24px}

/* inputs */
input,select{background:var(--surface);border:1.5px solid var(--line-2);border-radius:var(--r-sm)}
input:hover,select:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line-2))}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.seg{background:var(--surface-2);border-radius:14px;padding:4px}
.seg label{border-radius:10px;transition:background .2s,color .2s,box-shadow .2s}
.seg label:has(input:checked){background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 6px 16px -8px var(--accent)}
.opt[open]{background:var(--surface-2)}
.opt>summary .val.set{background:var(--coral-soft);color:var(--coral)}

/* buttons */
button{border-radius:var(--r-sm);border:1.5px solid var(--line-2);transition:transform .15s,box-shadow .2s,background .2s,border-color .2s}
button:hover:not(:disabled){border-color:var(--accent);background:var(--surface)}
.export .go,#oSave{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border:0;box-shadow:0 10px 22px -12px var(--accent)}
.export .go:hover:not(:disabled),#oSave:hover{transform:translateY(-1px);box-shadow:0 14px 26px -12px var(--accent);filter:none}
#addFl{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:600}
#delFl{background:var(--coral-soft);color:var(--coral);border-color:transparent;font-weight:600}
.icon-btn{border-radius:50%;width:40px;height:40px}
.filebtn{border-radius:var(--r-sm);border:1.5px solid var(--line-2)}
.filebtn:hover{border-color:var(--accent)}

/* measurement table */
.mtbl table{border-collapse:separate;border-spacing:0 6px}
.mtbl th{background:transparent;color:var(--muted);font-weight:600;font-size:12px}
.mtbl td{background:var(--surface-2);border:0}
.mtbl tr td:first-child{border-start-start-radius:12px;border-end-start-radius:12px}
.mtbl tr td:last-child{border-start-end-radius:12px;border-end-end-radius:12px}

.mtbl input{border-color:transparent;background:var(--surface)}
.hero.meas::before{background:linear-gradient(90deg,var(--coral),var(--amber))}
.hero.meas .rank{color:var(--coral);background:var(--coral-soft)}

/* views */
.v3d{border-radius:var(--r-md);border:0;box-shadow:inset 0 0 0 1px var(--line)}
.vplan{border-radius:var(--r-md);border:0;box-shadow:inset 0 0 0 1px var(--line);background:var(--surface)}
.vtag{background:var(--surface);padding:3px 10px;border-radius:99px;box-shadow:0 2px 8px -4px rgba(0,0,0,.2);color:var(--ink-2)}

/* notes, pills, misc */
.notes li{border-inline-start-width:4px;border-radius:12px}
.pill{font-weight:600}

.cfg span{color:var(--coral);font-size:18px}
.alt{border-radius:var(--r-md)}
.alt::before{height:4px}
.alts-h{border-radius:var(--r-md)}
.alts-h h3::before{color:var(--coral)}
.summary span{border-radius:99px;background:color-mix(in srgb,var(--surface) 85%,transparent);border-color:transparent;box-shadow:0 2px 8px -4px rgba(11,29,38,.18)}
.empty{border-style:dashed;border-width:2px;border-color:var(--line-2);background:color-mix(in srgb,var(--surface) 80%,transparent);position:relative;padding-inline-start:84px}
.empty::before{content:"";position:absolute;inset-inline-start:24px;top:26px;width:40px;height:52px;border-radius:8px;border:3px solid var(--accent);
  background:linear-gradient(90deg,transparent 47%,var(--accent) 47% 53%,transparent 53%)}
td.cutc{color:var(--coral)}
table.ord tr:nth-child(odd) td,table.ord tr:nth-child(odd) th{background:var(--surface-2)}

dl div{border-bottom-style:solid;border-bottom-color:var(--line)}

<form id="f" autocomplete="off">
  <p class="sec-t">מידות הפיר <span class="hint">פנים, מ"מ</span></p>
  <div class="row2">
    <label>רוחב פיר<input id="W" type="number" inputmode="numeric" step="10" placeholder=""></label>
    <label>עומק פיר<input id="D" type="number" inputmode="numeric" step="10" placeholder=""></label>
  </div>
  <p class="sec-t">כתפיים <span class="hint">לא חובה</span></p>
  <div class="row2">
    <label>כתף שמאל<input id="SL" type="number" inputmode="numeric" step="5" placeholder="0"></label>
    <label>כתף ימין<input id="SR" type="number" inputmode="numeric" step="5" placeholder="0"></label>
  </div>
  <p class="hint">שמאל/ימין כשעומדים בלובי מול הפיר.</p>
  <label class="fpsel">מיקום משקופים<select id="FP"><option value="std">סטנדרטי — סף בפיר, משקוף על הפודסט</option><option value="out">מחוץ לפיר — דלת ומשקוף על הפודסט</option><option value="in">בתוך הפיר — כל הדלת בפיר</option></select></label>
  <label class="fpsel">מרווח קבינה–שאסי<select id="CG"><option value="std">סטנדרטי 40–45</option><option value="mid">35 — עד 20 מ"מ יותר ברוחב</option><option value="min">25 — עד 40 מ"מ יותר ברוחב</option></select></label>
  <details class="opt lite-opt"><summary>הגדרות נוספות <span class="val" id="optv">הכול על מקסימום</span></summary><div class="lite-grid">
    <label>מספר נוסעים<select id="PS"><option value="">מקסימום אפשרי</option></select></label>
    <label>פתח אור<select id="CL"><option value="">מקסימלי</option><option>700</option><option>750</option><option>800</option><option>900</option><option>1000</option><option>1100</option></select></label>
    <label>סוג דלת<select id="DT"><option value="auto">הטוב ביותר</option><option value="T2">טלסקופית 2</option><option value="T3">טלסקופית 3</option><option value="C">מרכזית</option></select></label>
    <label>כיוון פתיחה<select id="DIR"><option value="auto">הטוב ביותר</option><option value="R">לימין</option><option value="L">לשמאל</option></select></label>
    <label>מספר תחנות<input id="ST" type="number" inputmode="numeric" placeholder="5"></label>
    <span></span>
    <label>רוחב תא רצוי<input id="CW" type="number" inputmode="numeric" step="10" placeholder="מקסימלי"></label>
    <label>עומק תא רצוי<input id="CD" type="number" inputmode="numeric" step="10" placeholder="מקסימלי"></label>
  </div></details>
  <label class="podest minclr"><input type="checkbox" id="MIN"><span><b>מרווחים מינימליים 280 / 110</b><small>מרווח משקולת 280 ופס בודד 110 במקום 300 / 120</small></span></label>
  <p class="minwarn" id="minwarn" hidden>⚠ מרווחים מינימליים מחייבים חתימה על המידות. במקרה של סטיות — יש לחצוב בבטון.</p>
  <p class="rule" id="rule"></p>
</form>
<section class="results" id="out" aria-live="polite"></section>
</div>
</div>

<script>

const PROJECTS = /*DATA*/[];
const APP_VERSION = 'v16';

/* ---------- parameters (derived from the drawings; edit here) ---------- */
const P = {
  extW: 60, extD: 30,                 // car exterior = interior + 60 (width) / + 30 (depth)
  NF: { // normal frame (miniGRLp / GRL2 / GRL4)
    small: {cwt: 310, oth: 140, cwtX: 280, othX: 110, rail: 45, railX: 30},   // up to 630 kg
    mid:   {cwt: 310, oth: 140, cwtX: 280, othX: 110, rail: 40, railX: 30},   // 750-1000 kg (GRL2)
    big:   {cwt: 480, oth: 250, cwtX: 450, othX: 200, rail: 45, railX: 35},   // GRL4 (Lord Capital 1250kg, David Noy 1600kg)
    cwtDepthReserve: 560,              // shaft depth >= cwt DBG + 560
  },
  RS: { side: 380, oth: 60, othX: 35 }, // rucksack: car+cwt rails on one wall
  front: 250, frontX: 250, frontOut: 180, back: 50, backX: 40, // front 250 normal; below only when the frames can go out of the shaft (shoulders allow); 180 absolute
  framePos: {std: 250, out: 180, in: 290},   // front gap by landing-frame position: std = sill in shaft, frame on landing; out = door+frame on the landing; in = whole door inside the shaft
  doorZone: {carDoor: 150, landDoor: 90},    // from the car front: 30+30 + car door 90 = 150, then landing door 90 (Felesa drawings)
  railMin: 25,                               // reduced car-to-chassis gap (std 45 / 40) — car walls are 30 each side
  shGap: 50,                           // ideal clear gap between landing frame and shoulder, each side
  front180: 240, side90: 240,
  jamb: 140, jambMin: 140, jambCtrl: 180, // landing door frame (jamb); frame controller needs 180
  flush: [45, 65],                     // telescopic: standard opening edge to car edge (exterior) on the non-stacking side
  stackMin: 150,                       // min car front panel on the stacking side (exterior) when the frame is shifted — drawings: p5 155, seen down to 130
  carDoor: {T2: 220, T3: 150, C: 260}, // car exterior width >= clear + this
  shaftDoor: {T2: c => 1.5*c + 180, T3: c => 1.34*c + 250, C: c => 2*c - 70},
  clears: [1300,1200,1100,1000,900,800,750,700,650,600],
  stops: 5, floorH: 3000, pit: 1500, head: 4000,
};
const LOADS = [320,375,450,525,630,750,800,900,1000,1275,1600,2000,2500];
// EN 81-20 table 6 — max available car area per rated load
const T6 = [[100,.37],[180,.58],[225,.70],[300,.90],[375,1.10],[400,1.17],[450,1.30],[525,1.45],[600,1.60],[630,1.66],[675,1.75],[750,1.90],[800,2.00],[825,2.05],[900,2.20],[975,2.35],[1000,2.40],[1050,2.50],[1125,2.65],[1200,2.80],[1250,2.90],[1275,2.95],[1350,3.10],[1425,3.25],[1500,3.40],[1600,3.56],[2000,4.20],[2500,5.00]];
// EN 81-20 table 8 — min area per number of persons
const T8 = [0,.28,.49,.60,.79,.98,1.17,1.31,1.45,1.59,1.73,1.87,2.01,2.15,2.29,2.43,2.57,2.71,2.85,2.99,3.13];
const STD = [ // Idan standards (interior W x D, DBG car / cwt) — orientation matters
  {w:1000,d:1250,q:450,dc:1150,dw:890,name:'סטנדרט 6 נוסעים'},
  {w:1100,d:1400,q:630,dc:1250,dw:1060,name:'סטנדרט 8 נוסעים'},
  {w:1150,d:1550,q:750,dc:1290,dw:1100,name:'סטנדרט 10 נוסעים'},
  {w:1100,d:2100,q:1000,dc:1220,dw:1100,name:'סטנדרט 13 נוסעים'},
];
const CWT_OPTS = q => q<=375?[690,590] : q<=450?[890,810,690,590] : q<=525?[1060,890] : q<=630?[1060,990] : q<=1000?[1100,960] : [1400];
const CTRL = {big:'ארון פיקוד גדול 450×250×2000', small:'ארון פיקוד קטן 160×150×2000', frame:'פיקוד במשקוף הקומה העליונה'};
const MODELS = {
  miniGRLp:{v:'--m-grlp',n:'miniGRLp · נורמל פריים'}, GRL2:{v:'--m-grl2',n:'GRL2 · נורמל פריים'}, GRL4:{v:'--m-grl4',n:'GRL4 · נורמל פריים'},
  miniGRL:{v:'--m-grl',n:'miniGRL · רוגזק'}, GRL2RS:{v:'--m-grl2r',n:'GRL2 · רוגזק'}};
const modelKey=o=>o.L==='RS'&&o.model==='GRL2'?'GRL2RS':o.model;

function maxAreaFor(q){ for(let i=0;i<T6.length-1;i++){const[a,x]=T6[i],[b,y]=T6[i+1]; if(q<=b) return x+(y-x)*(q-a)/(b-a);} return 5+(q-2500)/100*.16; }
function loadFor(area){ return LOADS.find(q => maxAreaFor(q) >= area - 1e-9) ?? null; }
function personsFor(q, area){ let p=Math.floor(q/75); while(p>1 && T8[Math.min(p,20)]>area+1e-9) p--; return p; }
function modelFor(layout,q){ if(layout==='RS') return q<=630?'miniGRL':'GRL2'; return q<=630?'miniGRLp':q<=1000?'GRL2':'GRL4'; }
function access(iw,id,clear){ if(iw>=2000&&id>=1400&&clear>=1100) return 'נגיש סוג 3'; if(iw>=1100&&id>=1400&&clear>=800) return 'נגיש סוג 2'; if(iw>=1000&&id>=1250&&clear>=800) return 'נגיש סוג 1'; return null; }
const fl10 = v => Math.floor(v/10)*10;
const dtName=d=>({T2:'טלסקופית 2',T3:'טלסקופית 3',C:'מרכזית'}[d]);
const sideName=s=>s==='L'?'שמאל':'ימין';
const dirName=d=>d==='C'?'מרכזית':d==='R'?'נפתחת לימין':'נפתחת לשמאל';

/* ---------- solver ---------- */
function solve(I){
  const opts=[], diag=[];
  const exc = true;                    // ideals (310/140, 240) are warnings; absolute limits are the 'x' values
  const layouts = I.en==='90' ? ['RS'] : ['NF','RS'];
  const want = I.cw||I.cd;
  for(const L of layouts) for(const side of ['L','R']) for(const mode of exc?['n','x']:['n']){
    if(I.en==='90' && side===I.s90) continue;      // rails on the wall opposite the side entrance
    if(I.forceSide && side!==I.forceSide) continue; // duplex: counterweights on the outer walls
    const cands=[];
    if(want){
      for(const Q of LOADS){
        if(L==='RS' && Q>1000) continue;
        const g=carEnvelope(I,L,mode,Q); if(!g) continue;
        const iw=I.cw||g.iw, id=I.cd||Math.min(g.id,fl10(maxAreaFor(Q)*1e6/iw));
        if(iw>g.iw||id>g.id){ diag.push({L,mode,dw:iw-g.iw,dd:id-g.id}); continue; }
        if(loadFor(iw*id/1e6)!==Q) continue;
        cands.push({iw,id,kind:'want'});
      }
    } else {
      for(const Q of LOADS){
        if(L==='RS' && Q>1000) continue;
        const g=carEnvelope(I,L,mode,Q); if(!g) continue;
        const id=Math.min(g.id,fl10(maxAreaFor(Q)*1e6/g.iw));
        if(id<800) continue;
        cands.push({iw:g.iw,id,kind:'max'});
      }
      for(const s of STD){ const e=carEnvelope(I,L,mode,s.q); if(e && s.w<=e.iw && s.d<=e.id) cands.push({iw:s.w,id:s.d,kind:'std',std:s}); }
    }
    for(const c of cands){ const o=build(I,L,side,mode,c); if(o) opts.push(o); }
  }
  const m=new Map();
  for(const o of opts){ const k=[o.L,o.q,o.mode,o.isStd?o.stdName:'',o.iw,o.id].join('|'),p=m.get(k); if(!p||o.score>p.score) m.set(k,o); }
  const m2=new Map();
  for(const o of m.values()){ const k=[o.L,o.q,o.mode,o.isStd?o.stdName:''].join('|'),p=m2.get(k); if(!p||o.area>p.area+0.005||(Math.abs(o.area-p.area)<=0.005&&o.score>p.score)) m2.set(k,o); }
  let list=[...m2.values()];
  const bestNormal=Math.max(0,...list.filter(o=>o.mode==='n'&&o.L==='NF').map(o=>o.area));
  list=list.filter(o=>o.mode==='n' || o.area>bestNormal+0.005);
  if(I.ps) list=list.filter(o=>o.persons===I.ps);
  // preference: normal frame > rucksack, no shoulder cutting, no top-floor cutting, then largest car
  const idealFirst = I.mx!=='abs' && !want && !I.ps;   // 'maximum' = largest within the ideal clearances unless asked otherwise
  const tier=o=>(o.L==='NF'?8:0)+(o.cuts.length?0:4)+(idealFirst&&o.mode==='n'?2:0)+(o.ctrl.cut?0:1);
  list.sort((a,b)=> tier(b)-tier(a) || b.area-a.area || b.score-a.score);
  return {list:list.slice(0,12), diag};
}

function clr(L,q){ return L==='RS'?null : q<=630?P.NF.small : q<=1000?P.NF.mid : P.NF.big; }

function canPushOut(I){ // landing frame fits between the shoulders with the 50 mm gap -> it can sit in the wall opening
  const frameW=(I.clear||800)+2*P.jamb;
  return I.W-I.SL-I.SR >= frameW+2*P.shGap;
}
function frontMin(I,x){ return I.en==='180'? P.front180 : (P.framePos[I.fp] ?? P.framePos.std); }   // frame position is its own choice, independent of the clearance mode
const railOf=(I,k)=> I.cg==='min'? Math.min(P.railMin,k.rail) : I.cg==='mid'? Math.min(35,k.rail) : k.rail;                            // car exterior to car-rail DBG, each side
function carEnvelope(I,L,mode,q){
  const x = mode==='x';
  const front = frontMin(I,x);
  const back  = I.en==='180'? P.front180 : (x?P.backX:P.back);
  const id = fl10(I.D - front - back - P.extD);
  let iw;
  if(L==='RS'){
    const oth = I.en==='90' ? P.side90 : (x?P.RS.othX:P.RS.oth);
    iw = fl10(I.W - P.RS.side - oth - P.extW);
  } else {
    const c=clr('NF',q);
    iw = fl10(I.W - (x?c.cwtX:c.cwt) - (x?c.othX:c.oth) - 2*railOf(I,c) - P.extW);
  }
  if(iw<600||id<800) return null;
  return {iw,id};
}

// place a door of clear width cl on an axis: car spans [a,b], wall opening spans [oa,ob].
// dir: 'A' = flush to a (panels stack toward b), 'B' = flush to b, 'C' = centred, 'auto' = best of A/B.
function placeDoor(cl,a,b,oa,ob,dt,dir,jmin){
  const tries = dt==='C' ? ['C'] : dir==='auto' ? ['A','B'] : [dir];
  let best=null;
  for(const d of tries){
    let lo,hi;
    if(d==='C'){ lo=hi=Math.round(a+(b-a-cl)/2); }
    else if(d==='A'){ lo=a+P.flush[0]; hi=Math.max(lo, b-cl-P.stackMin); }   // frame may shift toward the stacking side
    else { hi=b-P.flush[0]-cl; lo=Math.min(hi, a+P.stackMin); }
    const ideal=oa+(ob-oa-cl)/2;
    const o1=Math.round(Math.min(hi,Math.max(lo,ideal)));
    const ja=o1-oa, jb=ob-o1-cl, cuts=[];
    if(ja<jmin) cuts.push({end:'A',mm:jmin-ja});
    if(jb<jmin) cuts.push({end:'B',mm:jmin-jb});
    const r={o1,ja:Math.max(ja,cuts.some(k=>k.end==='A')?jmin:ja),jb:Math.max(jb,cuts.some(k=>k.end==='B')?jmin:jb),cuts,dir:d,lo,hi,cl};
    const sc=-cuts.reduce((s,k)=>s+k.mm,0)*10+Math.min(ja,jb);
    if(!best||sc>best.sc) best={...r,sc};
  }
  return best;
}

function build(I,L,side,mode,c){
  const x = mode==='x', notes=[];
  let iw=c.iw, id=c.id;
  const area = iw*id/1e6;
  let q = loadFor(area); if(!q) return null;
  if(c.kind==='std') q=c.std.q;
  if(L==='RS' && q>1000) return null;
  const extW=iw+P.extW, extD=id+P.extD;
  let dbgCar, dbgCwt, gapCwt, gapOth, carL, railOff=0;
  const front = frontMin(I,x);
  const wantC = I.SL + (I.W-I.SL-I.SR)/2;
  if(L==='NF'){
    const k=clr('NF',q);
    const rail = railOf(I,k);
    dbgCar = c.kind==='std' ? Math.max(c.std.dc, extW+2*rail) : extW + 2*rail;
    if(c.kind==='std' && dbgCar + (x?k.cwtX:k.cwt) + (x?k.othX:k.oth) > I.W) dbgCar = extW+2*rail;
    if(rail<k.rail) notes.push({t:`מרחק קבינה-מסילה ${rail} (סטנדרט ${k.rail})`,c:'warn'});
    const rest = I.W - dbgCar;
    const minC = x?k.cwtX:k.cwt, minO = x?k.othX:k.oth;
    if(rest < minC+minO) return null;
    const ideal = side==='L' ? wantC - dbgCar/2 : I.W - wantC - dbgCar/2;
    gapCwt = Math.round(Math.min(rest-minO, Math.max(minC, ideal))); gapOth = rest-gapCwt;
    var gapRange=[minC, rest-minO], gapToCarL = g => side==='L' ? g + (dbgCar-extW)/2 : I.W - g - dbgCar + (dbgCar-extW)/2;
    const cwtList = c.kind==='std'?[c.std.dw,...CWT_OPTS(q).filter(v=>v!==c.std.dw)]:CWT_OPTS(q);
    dbgCwt = cwtList.find(v => v + P.NF.cwtDepthReserve <= I.D);
    if(q>1000){ dbgCwt = 1400; notes.push({t:'GRL4: מבוסס על 2 פרויקטים בלבד במאגר — לאמת מול Felesa.',c:'warn'}); }
    else if(!dbgCwt) return null;
    else if(dbgCwt!==cwtList[0]) notes.push({t:`DBG משקולת מקוצר ${dbgCwt} (סטנדרט ${cwtList[0]}) בגלל עומק הפיר`,c:'warn'});
    railOff=(dbgCar-extW)/2;
    carL = side==='L' ? gapCwt + railOff : gapOth + railOff;
  } else {
    const minO = I.en==='90'?P.side90:(x?P.RS.othX:P.RS.oth);
    const rest=I.W-extW;
    if(rest-P.RS.side<minO) return null;
    const ideal = side==='L' ? wantC - extW/2 : I.W - wantC - extW/2;
    gapCwt=Math.round(Math.min(rest-minO, Math.max(P.RS.side, ideal))); gapOth=rest-gapCwt;
    var gapRange=[P.RS.side, rest-minO], gapToCarL = g => side==='L' ? g : I.W - g - extW;
    dbgCar = Math.max(520, extD-430); dbgCwt=dbgCar+46;
    carL = side==='L' ? gapCwt : gapOth;
    notes.push({t:'רוגזק — אפשרות משנית.',c:''});
    if(q>630) notes.push({t:'רוגזק מעל 630 ק"ג (GRL2) — פרויקט אחד בלבד במאגר, לאמת מול Felesa',c:'warn'});
  }
  if(I.en!=='180' && I.fp==='out') notes.push({t:`משקופים מחוץ לפיר (על הפודסט) — מרווח חזית ${front}`+(canPushOut(I)?'':' — הפתח בין הכתפיים צר: לבדוק שהדלת והמשקוף נכנסים'),c:canPushOut(I)?'':'warn'});
  if(I.en!=='180' && I.fp==='in') notes.push({t:`משקופים בתוך הפיר — מרווח חזית ${front}`,c:''});
  if(L==='NF' && (I.cg==='min'||I.cg==='mid')) notes.push({t:`מרווח קבינה–שאסי מצומצם ${railOf(I,clr('NF',q))} בכל צד (סטנדרט ${clr('NF',q).rail})`,c:'warn'});
  const cy = I.D-front-extD;

  // ---- front landing door: try every car position (10 mm steps) and keep the best door
  const dt=I.dt;
  const dirPref = dt==='C'?'C': I.dir==='R'?'A' : I.dir==='L'?'B' : 'auto'; // opens right -> stacks right -> flush left (A)
  const carMax = extW - P.carDoor[dt];
  const oL=I.SL, oR=I.W-I.SR;
  const fits = cl => cl<=carMax && P.shaftDoor[dt](cl) <= I.W;
  const ok=P.clears.filter(fits);
  if(I.clear ? !fits(I.clear) : !ok.length) return null;
  const canCtrl = v => { if(I.ct!=='frame' || dt==='C') return true; const need=P.jambCtrl-Math.max(v.ja,v.jb); if(need<=0) return true;
    const sh = v.ja>=v.jb? need : -need, n1=v.o1+sh, other = v.ja>=v.jb? v.jb-need : v.ja-need;
    return n1>=v.lo && n1<=v.hi && other>=P.jambMin; };
  const gaps=[]; for(let g=gapRange[0]; g<=gapRange[1]; g+=10) gaps.push(g); if(!gaps.includes(gapCwt)) gaps.push(gapCwt);
  let best=null;
  for(const g of gaps){
    const cL=gapToCarL(g), pl=cl=>placeDoor(cl,cL,cL+extW,oL,oR,dt,dirPref,P.jambMin);
    let d;
    if(I.clear) d=pl(I.clear);
    else { const all=ok.map(pl); d = all.find(v=>!v.cuts.length && canCtrl(v)) || all.find(v=>!v.cuts.length) || all[all.length-1]; }
    const cutMM=d.cuts.reduce((t,k)=>t+k.mm,0);
    const sg = Math.min(Math.min(d.ja,d.jb)-P.jamb, P.shGap);
    const sc = -cutMM*100 + d.cl*10 + (canCtrl(d)?500:0) - Math.abs(d.ja-d.jb)*5 - Math.abs(g-gapCwt)/10;   // frame centred in the opening: equal gaps beat 50 on one side only
    if(!best||sc>best.sc) best={sc,g,d,cL};
  }
  gapCwt=best.g; gapOth=(L==='NF'?I.W-dbgCar:I.W-extW)-gapCwt; carL=best.cL;
  const carR = carL+extW, d=best.d;
  if(!I.clear){
    const bigger = ok.filter(cl=>cl>d.cl).pop();
    if(bigger && !d.cuts.length){ const b2=placeDoor(bigger,carL,carR,oL,oR,dt,dirPref,P.jambMin);
      if(b2.cuts.length) notes.push({t:`עם ניסור כתפיים (${b2.cuts.map(k=>sideName(k.end==='A'?'L':'R')+' '+k.mm).join(', ')} מ"מ) אפשר פתח ${bigger}`,c:''});
      else notes.push({t:`פתח ${bigger} אפשרי עם ארון פיקוד במקום פיקוד במשקוף`,c:''}); }
  }
  if(L==='NF'){ const k=clr('NF',q);
    if(gapCwt<k.cwt) notes.push({t:`מרווח משקולת ${gapCwt} — מתחת לאידיאל ${k.cwt}`,c:'warn'});

/* ---------- result model: one or two lifts in one shaft ---------- */
// R = {W, D, I, lifts:[{o, x0}], openings:[{a,b,cutA,cutB}], beam:{x,w}|null, duplex:bool}
function singleR(o){
  const I=o.I, fc=k=>o.frontCuts.find(c=>c.side===k)?.mm||0;
  return {W:I.W, D:I.D, I, lifts:[{o,x0:0}], openings:[{a:I.SL,b:I.W-I.SR,cutA:fc('L'),cutB:fc('R')}], beam:null, duplex:false, main:o};
}
function duplexSplit(I,bx){
  // identical lifts -> beam exactly in the middle of the common shaft; unequal lifts pass the beam position
  const bw=I.beam||100;
  if(bx==null) bx=Math.round((I.W-bw)/2);
  const WL=bx, x0R=bx+bw, WR=I.W-x0R;
  const sRL=WL-(I.SL+I.openL), sLR=(I.SL+I.openL+I.pillar)-x0R;
  const IL={...I, W:WL, SR:Math.max(0,sRL), forceSide:'L', en:'1'};
  const IR={...I, W:WR, SL:Math.max(0,sLR), forceSide:'R', en:'1'};
  return {IL,IR,bx,bw,x0R,sRL,sLR};
}
// mirror a solved lift about the shaft centre line (identical lifts in a symmetric duplex)
function mirrorLift(o,I2){
  const W=I2.W, sw=x=>x==='L'?'R':x==='R'?'L':x, fl=k=>({...k,side:sw(k.side)});
  return {...o, I:I2, side:sw(o.side), carL:W-o.carL-o.extW, o1:W-o.o1-o.clear, doorDir:sw(o.doorDir),
    jl:o.jr, jr:o.jl, legL:o.legR, legR:o.legL, shGapL:o.shGapR, shGapR:o.shGapL, panL:o.panR, panR:o.panL,
    cuts:o.cuts.map(fl), frontCuts:o.frontCuts.map(fl), ctrl:{...o.ctrl, side:sw(o.ctrl.side)}, notes:o.notes};
}
function sizeTitle(R){ if(!R.duplex) return `${R.main.iw}×${R.main.id}`; const [a,b]=R.lifts.map(l=>l.o); return a.iw===b.iw&&a.id===b.id? `2 × ${a.iw}×${a.id}` : `${a.iw}×${a.id} + ${b.iw}×${b.id}`; }
const dTier=R=>R.lifts.reduce((t,{o})=>t+(o.L==='NF'?8:0)+(o.cuts.length?0:4)+(o.mode==='n'?2:0),0);
function duplexPair(I,s,a,b){
  const fcA=k=>a.frontCuts.find(c=>c.side===k)?.mm||0, fcB=k=>b.frontCuts.find(c=>c.side===k)?.mm||0;
  const notes=[];
  if(s.sRL<0) notes.push({t:`הפתח השמאלי עובר את הקורה ב-${-s.sRL} מ"מ`,c:'warn'});
  if(s.sLR<0) notes.push({t:`הפתח הימני עובר את הקורה ב-${-s.sLR} מ"מ`,c:'warn'});
  const carGap=Math.round(s.x0R+b.carL-(a.carL+a.extW)); // car exterior to car exterior
  if(carGap<600) notes.push({t:`המרחק בין הקבינות ${carGap} מ"מ — פחות מ-600`,c:'warn'});
  return {W:I.W,D:I.D,I,duplex:true,main:a,notes,carGap,
    lifts:[{o:a,x0:0},{o:b,x0:s.x0R}],
    openings:[{a:I.SL,b:I.SL+I.openL,cutA:fcA('L'),cutB:fcA('R')},{a:I.SL+I.openL+I.pillar,b:I.W-I.SR,cutA:fcB('L'),cutB:fcB('R')}],
    beam:{x:s.bx,w:s.bw}};
}
// per-lift request: {ps, cw, cd}; I.sides = {L:req, R:req|'same'} (free screen). Without sides both lifts use I.ps/cw/cd.
function solveDuplex(I){
  const base={ps:I.ps??null,cw:I.cw??null,cd:I.cd??null};
  const rL=I.sides?.L||base, rR=(!I.sides?.R||I.sides.R==='same')?rL:I.sides.R;
  const same=rL.ps===rR.ps&&rL.cw===rR.cw&&rL.cd===rR.cd;
  const bw=I.beam||100, mid=Math.round((I.W-bw)/2), p0=I.SL+I.openL, p1=p0+I.pillar-bw;
  if(same && mid>=p0 && mid<=p1) return solveDuplexSame({...I,...rL});   // identical lifts, pillar in the middle -> beam in the middle
  return solveDuplexUnequal(I,rL,rR,same);
}
// unequal lifts: slide the beam behind the pillar (and beyond, penalised) so each lift gets the shaft it needs
function solveDuplexUnequal(I,rL,rR,same){
  const bw=I.beam||100, p0=I.SL+I.openL, p1=I.SL+I.openL+I.pillar-bw, mid=(p0+p1)/2;
  const lo=Math.max(700,Math.min(p0,p1)-600), hi=Math.min(I.W-bw-700,Math.max(p0,p1)+600);
  const best=new Map();
  for(let bx=Math.ceil(lo/10)*10; bx<=hi; bx+=10){
    const s=duplexSplit(I,bx);
    const a=solve({...s.IL,...rL}).list[0]; if(!a) continue;
    const b=solve({...s.IR,...rR}).list[0]; if(!b) continue;
    const R=duplexPair(I,s,a,b), over=Math.max(0,-s.sRL)+Math.max(0,-s.sLR);
    R.sc = -over*1e5 + dTier(R)*1e3 + (a.area+b.area)*100 - Math.abs(bx-mid)/100 - (R.carGap<600?(600-R.carGap)*10:0)
      - (same&&(a.iw!==b.iw||a.id!==b.id)?5e4:0);
    const k=[a.L,a.iw,a.id,b.L,b.iw,b.id].join('|'), p=best.get(k);
    if(!p||R.sc>p.sc) best.set(k,R);
  }
  const notesR=R=>{ const oc=R.beam.x-(I.W-bw)/2; if(Math.abs(oc)>=10) R.notes.push({t:`הקורה הוזזה ${Math.abs(Math.round(oc))} מ"מ ${oc>0?'ימינה':'שמאלה'} מאמצע הפיר — ${same?'כדי לעמוד מאחורי העמוד':'מעליות בגדלים שונים'}`,c:''}); return R; };
  return [...best.values()].sort((p,q)=>q.sc-p.sc).slice(0,10).map(notesR);
}
function solveDuplexSame(I){
  const s=duplexSplit(I);
  const L=solve(s.IL).list, Rr=solve(s.IR).list;
  const sizes=[]; for(const o of [...L,...Rr]) if(!sizes.some(z=>z.iw===o.iw&&z.id===o.id)) sizes.push({iw:o.iw,id:o.id});
  const pairs=[];
  for(const z of sizes){
    const a=solve({...s.IL,cw:z.iw,cd:z.id,ps:null}).list[0];
    const sym = a && Math.abs(s.IL.W-s.IR.W)<=1 && Math.abs(s.IL.SL-s.IR.SR)<=1 && Math.abs(s.IL.SR-s.IR.SL)<=1;
    const b = sym ? mirrorLift(a,s.IR) : solve({...s.IR,cw:z.iw,cd:z.id,ps:null}).list[0];
    if(!a||!b) continue;
    if(I.ps && a.persons!==I.ps) continue;
    if(I.cw && a.iw!==I.cw || I.cd && a.id!==I.cd) continue;
    pairs.push(duplexPair(I,s,a,b));
  }
  pairs.sort((p,q)=>dTier(q)-dTier(p) || q.main.area-p.main.area);
  return pairs.slice(0,10);
}

/* ---------- PDF export (English, no Hebrew) ---------- */
async function exportPDF(R, project, order){
  const st=$('pdfst'); const say=(m,c='')=>{ if(st){ st.textContent=m; st.className='pdfst '+c; } };
  try{
    if(!window.jspdf){ say('ספריית ה-PDF לא נטענה','warn'); return; }
    const dl = window.claude?.use ? await window.claude.use('downloads') : null;
    if(!dl && window.claude){ say('הורדת קבצים זמינה רק בצפייה דרך claude.ai','warn'); return; }
    say('מכין PDF…');
    const svg=drawPlan(R,{lang:'en',print:true});
    const vb=svg.match(/viewBox="([^"]+)"/)[1].split(' ').map(Number);
    const scale=3200/Math.max(vb[2],vb[3]);
    const img=new Image(); const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));
    await new Promise((ok,bad)=>{ img.onload=ok; img.onerror=bad; img.src=url; });
    const cv=document.createElement('canvas'); cv.width=Math.round(vb[2]*scale); cv.height=Math.round(vb[3]*scale);
    const g=cv.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,cv.width,cv.height); g.drawImage(img,0,0,cv.width,cv.height); URL.revokeObjectURL(url);
    const png=cv.toDataURL('image/jpeg',0.9);
    const { jsPDF } = window.jspdf; const doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a3'});
    const PW=420, PH=297, M=12, side=118;
    // drawing area
    const aw=PW-2*M-side-8, ah=PH-2*M-14, r=Math.min(aw/cv.width, ah/cv.height);
    doc.addImage(png,'JPEG',M,M+14,cv.width*r,cv.height*r,undefined,'FAST');
    doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.text('IDAN LIFTS — SHAFT TOP VIEW / SETTING-OUT',M,M+6);
    // info panel
    let x=PW-M-side, y=M+2; const ln=(k,v)=>{ doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(90); doc.text(k,x,y); doc.setTextColor(13); doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.text(String(v),x+side,y,{align:'right'}); y+=6.2; };
    const hd=t=>{ y+=2; doc.setDrawColor(200); doc.line(x,y-4,x+side,y-4); doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(53,84,209); doc.text(t,x,y+1); y+=7; };
    doc.setDrawColor(210); doc.rect(x-4,M-4,side+8,PH-2*M+8);
    hd('PROJECT'); ln('Project / Ref', (project||'-').replace(/[^\x20-\x7E]/g,'') || '-'); ln('Date', new Date().toLocaleDateString('en-GB'));
    const I=R.I;
    hd('SHAFT'); ln(R.duplex?'Common shaft W x D':'Shaft W x D', `${R.W} x ${R.D} mm`); ln('Stops', I.stops);
    if(R.duplex) ln('Pillar between openings', `${I.pillar} mm`), ln('Separation beam', `${R.beam.w} mm`);
    R.lifts.forEach(({o},i)=>{
      hd(R.duplex? (i===0?'LIFT LEFT':'LIFT RIGHT') : 'LIFT');

/* ---------- zoom & pan inside the top view: wheel / pinch / buttons, drag to pan, double-click to reset ---------- */
function planZoom(){
  document.querySelectorAll('.vplan').forEach(box=>{
    const svg=box.querySelector('svg'); if(!svg||svg.dataset.pz) return; svg.dataset.pz='1';
    const v0=svg.getAttribute('viewBox').split(/[\s,]+/).map(Number), v=[...v0], ar=v0[3]/v0[2];
    box.insertAdjacentHTML('beforeend','<div class="pz"><button type="button" data-z="in" aria-label="הגדל">+</button><button type="button" data-z="out" aria-label="הקטן">−</button><button type="button" data-z="0" aria-label="תצוגה מלאה">⤢</button></div>');
    const apply=()=>{ v[2]=Math.min(v0[2],Math.max(v0[2]/15,v[2])); v[3]=v[2]*ar;
      v[0]=Math.min(v0[0]+v0[2]-v[2],Math.max(v0[0],v[0])); v[1]=Math.min(v0[1]+v0[3]-v[3],Math.max(v0[1],v[1]));
      svg.setAttribute('viewBox',v.map(n=>+n.toFixed(1)).join(' ')); box.classList.toggle('zoomed',v[2]<v0[2]*0.99); };
    const scale=()=>{ const r=svg.getBoundingClientRect(); return {r,s:Math.min(r.width/v[2],r.height/v[3])}; };
    const toVB=(cx,cy)=>{ const {r,s}=scale(); return [v[0]+(cx-r.left-(r.width-v[2]*s)/2)/s, v[1]+(cy-r.top-(r.height-v[3]*s)/2)/s]; };
    const zoomAt=(cx,cy,f)=>{ const [x,y]=toVB(cx,cy), w=Math.min(v0[2],Math.max(v0[2]/15,v[2]/f)), k=w/v[2];
      v[0]=x-(x-v[0])*k; v[1]=y-(y-v[1])*k; v[2]=w; apply(); };
    const centre=()=>{ const r=svg.getBoundingClientRect(); return [r.left+r.width/2, r.top+r.height/2]; };
    box.querySelector('.pz').onclick=e=>{ const z=e.target.closest('button')?.dataset.z; if(!z) return;
      if(z==='0'){ v.splice(0,4,...v0); apply(); } else zoomAt(...centre(), z==='in'?1.6:1/1.6); };
    svg.addEventListener('wheel',e=>{ const out=e.deltaY>0; if(out && !box.classList.contains('zoomed')) return; // let the page scroll
      e.preventDefault(); zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*(e.deltaMode?0.05:0.0015))); },{passive:false});
    svg.addEventListener('dblclick',()=>{ v.splice(0,4,...v0); apply(); });
    const pts=new Map(); let pinch=null;
    svg.addEventListener('pointerdown',e=>{ if(!box.classList.contains('zoomed')&&e.pointerType!=='touch') return;
      pts.set(e.pointerId,[e.clientX,e.clientY]); svg.setPointerCapture(e.pointerId);
      if(pts.size===2){ const [p,q]=[...pts.values()]; pinch=Math.hypot(p[0]-q[0],p[1]-q[1]); } });
    svg.addEventListener('pointermove',e=>{ const prev=pts.get(e.pointerId); if(!prev) return;
      const cur=[e.clientX,e.clientY]; pts.set(e.pointerId,cur);
      if(pts.size===2){ const [p,q]=[...pts.values()], d=Math.hypot(p[0]-q[0],p[1]-q[1]); if(pinch) zoomAt((p[0]+q[0])/2,(p[1]+q[1])/2,d/pinch); pinch=d; return; }
      if(!box.classList.contains('zoomed')) return;
      const {s}=scale(); v[0]-=(cur[0]-prev[0])/s; v[1]-=(cur[1]-prev[1])/s; apply(); });
    const up=e=>{ pts.delete(e.pointerId); if(pts.size<2) pinch=null; };
    svg.addEventListener('pointerup',up); svg.addEventListener('pointercancel',up);
  });
}

}
function read(){
  return {W:num('W')||0, D:num('D')||0, SL:num('SL')||0, SR:num('SR')||0, stops:num('ST')||P.stops, dt:$('DT').value, dir:$('DIR').value,
    en:'1', fp:$('FP').value, cg:$('CG').value, minClr:$('MIN').checked, ct:'small', s90:'R', sm:'single', clear:+$('CL').value||null, ex:true, mx:'ideal', ps:+$('PS').value||null, cw:num('CW'), cd:num('CD')};
}
function optSummary(I){
  const t=[]; if(I.ps) t.push(`${I.ps} נוסעים`); if(I.clear) t.push(`פתח ${I.clear}`); if(I.dt!=='auto') t.push(dtName(I.dt));
  if(I.dir!=='auto') t.push(I.dir==='R'?'לימין':'לשמאל'); if(I.cw||I.cd) t.push(`תא ${I.cw??'מקס'}×${I.cd??'מקס'}`);
  $('optv').textContent=t.length?t.join(' · '):'הכול על מקסימום'; $('optv').classList.toggle('set',t.length>0);
}
function render(){
  const I=read(), out=$('out'); optSummary(I);
  try{ localStorage.setItem('lite',JSON.stringify({...Object.fromEntries(OPT_IDS.map(k=>[k,$(k).value])),MIN:$('MIN').checked})); }catch{}
  setClr(I.minClr); const c=I.minClr?CLR.min:CLR.std;
  $('rule').innerHTML=`מרווח משקולת <b class="num">${c.cwt}</b> · פס בודד <b class="num">${c.oth}</b> — לא יורדים מזה`; $('minwarn').hidden=!I.minClr;
  if(I.W<1000||I.D<1000){ out.innerHTML='<div class="empty"><b>הזן רוחב ועומק פיר</b>במילימטרים, מידות פנים. כתפיים — אם יש. התוכנה תחזיר את הקבינה הגדולה ביותר שנכנסת עם מרווח משקולת 300 ופס בודד 120.</div>'; return; }
  if(I.SL+I.SR>=I.W){ out.innerHTML='<div class="empty"><b>הכתפיים רחבות מהפיר</b>בדוק את המידות.</div>'; return; }
  // door type "best": telescopic 2, else telescopic 3 (narrower car), else central — a normal frame beats a rucksack
  const run=dt=>solve({...I,dt}).list.filter(o=>o.mode!=='x');   // standard rail/front/back distances; only cwt/rail-side gaps change
  if(I.dt==='auto'){ const all=['T2','T3','C'].map(run); LIST=all.find(l=>l[0]?.L==='NF')||all.find(l=>l.length)||[]; } else LIST=run(I.dt);
  SEL=0; show(I);   // standard rail/front/back distances; only cwt/rail-side gaps are fixed at 300/120
}
function show(I){
  const out=$('out');
  const head=`<div class="summary"><span>פיר <b class="num">${I.W}×${I.D}</b></span><span>פתח בין כתפיים <b class="num">${I.W-I.SL-I.SR}</b></span>${I.fp!=='std'?`<span>משקופים ${I.fp==='out'?'מחוץ לפיר':'בתוך הפיר'}</span>`:''}${I.cg!=='std'?`<span>מרווח שאסי ${I.cg==='min'?25:35}</span>`:''}</div>`;
  if(!LIST.length){ out.innerHTML=head+`<div class="empty"><b>לא נמצאה קבינה</b>אין קבינה שנכנסת לפיר הזה עם מרווח משקולת 300 ופס בודד 120${I.ps||I.cw||I.cd||I.clear?' ובדרישות שבהגדרות הנוספות — נסה להחזיר אותן למקסימום':''}.</div>`; return; }
  const o=LIST[SEL], notes=o.notes.filter(n=>!/ארון|רוגזק — אפשרות משנית/.test(n.t));
  if(I.minClr) notes.unshift({t:'מרווחים מינימליים 280/110 — מחייב חתימה על המידות. במקרה של סטיות יש לחצוב בבטון.',c:'warn'});
  out.innerHTML=head+`
  <article class="hero" style="${mcStyle(o)}">
    <div class="bar">
      <div class="t">
        <span class="rank">${SEL===0?'הקבינה המקסימלית':`אפשרות ${SEL+1}`}</span>
        <h2><span class="num">${o.iw}×${o.id}</span><small>מ"מ פנים</small></h2>
        <div class="pills">${pills(o)}</div>
      </div>
      <div class="nav"><button type="button" class="icon-btn" id="prev" aria-label="הקודמת" ${SEL===0?'disabled':''}>${ICON.prev}</button><span class="cnt num">${SEL+1} / ${LIST.length}</span><button type="button" class="icon-btn" id="next" aria-label="הבאה" ${SEL>=LIST.length-1?'disabled':''}>${ICON.next}</button></div>
    </div>
    <div class="kpis">
      <div class="kpi"><span>עומס</span><b><span class="num">${o.q}</span><small>ק"ג</small></b></div>
      <div class="kpi"><span>נוסעים</span><b>${o.persons}</b></div>
      <div class="kpi"><span>פתח אור</span><b><span class="num">${o.clear}</span><small>${dtName(o.dt)}${o.dt!=='C'?' · '+(o.doorDir==='R'?'לימין':'לשמאל'):''}</small></b></div>
      <div class="kpi"><span>${o.L==='NF'?'משקולת / פס בודד':'מרווח צד'}</span><b><span class="num">${o.gapCwt} / ${o.gapOth}</span></b></div>
    </div>
    <div class="lite-plan vplan"><span class="vtag">מבט על</span>${drawPlan(singleR(o))}</div>
    ${notes.length?`<ul class="notes lite-notes">${notes.map(n=>`<li class="${n.c}">${n.t}</li>`).join('')}</ul>`:''}
  </article>`;
  $('prev').onclick=()=>{ if(SEL>0){ SEL--; show(I); } };
  $('next').onclick=()=>{ if(SEL<LIST.length-1){ SEL++; show(I); } };
  planZoom();
}
for(let p=4;p<=21;p++) $('PS').insertAdjacentHTML('beforeend',`<option value="${p}">${p} נוסעים</option>`);
try{ const s=JSON.parse(localStorage.getItem('lite')||'{}'); for(const k of OPT_IDS) if(s[k]!=null) $(k).value=s[k];  $('MIN').checked=!!s.MIN; }catch{}
$('f').addEventListener('input',render); $('f').addEventListener('submit',e=>e.preventDefault());
render();
</script>

</body></html>
